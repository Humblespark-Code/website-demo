<!DOCTYPE html>
<html>
<head>
    
    <title>YouTube.com Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,
wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 

    <style>
     
    .video-grid{
        display: grid;
        grid-template-columns:(1fr, 1fr);
        gap: 25px;
      }

      p{
        font-family: 'Roboto', arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .thumbnail{
        width: 300px; 
        height: 180px;
        display: block;
        margin-bottom: 25px;
        cursor: pointer;
      }
      .search-bar{
        display: block;
        width: 300px;
        height: 30px;
        margin-bottom: 25px;
      }
      .video-author{
         display:inline-block;
      }
      .video-preview{
        width: 300px;
        height: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 25px;
        
      }
     .channel-picture{
        display: inline-block;
        width: 50px;
        vertical-align: top;
        background-color: gray;
      }
      .video-info{
        display:inline-block;
        width: 245px;
        background-color: gray;
      }
       .profile-picture{
        width: 60%;
        border-radius: 50%;
       }
       .video-title{
        margin-top: 0px;
        font-size: 16px;
        font-weight: 500;
        line-height: 20px;
        margin-bottom: 15px;
       }
       .thumbnail-row{
        margin-bottom: 12px;
       }
       .video-author,
       .video-stats{
        font-size: 14px;
        color: #606060;
        margin-top: 0px;
        margin-bottom: 0px;
       }
      .video-author{
        margin-bottom: 5px;
      }
      
  
    </style>
</head> 

<body>

  <input class="search-bar" type="text" placeholder="Search">
  <div></div>


  <div></div>
  
  <div class="thumbnail-row red ">
    <img class="thumbnail" src="    thumbnails/thumbnail-1.webp">
  </div>
  <div>
    <div class="channel-picture">
      <img class="profile-picture" src="channel-pictures/channel-1.jpeg">
    </div>

    <div class="video-info">
    
    <p class="video-title">
    Talking Tech and Ai with
    Google CEO Sundar Pichai! 
  </p>
  <p class="video-author">
    Marques Brownlee 
  </p>
  <p class="video-stats">
    3.4M views &#183; 6 months ago
  </p>
</div>
    
  
  </div>
  
<div class="video-preview">
  
  
  <div class="thumbnail-row">
    <img class="thumbnail" src="    thumbnails/thumbnail-2.webp">
  </div>

    <div class="channel-picture">
      <img class="profile-picture" src="channel-pictures/channel-2.jpeg">
    </div>

    <div class="video-info">
    
    <p class="video-title">
    Try Not to Laugh Challenge #9
  </p>
  <p class="video-author">
    Markiplier
  </p>
  <p class="video-stats">
    19M views &#183; 4 years ago
  </p>

</div>


<div class="video-preview">
  
  
  <div class="thumbnail-row">
    <img class="thumbnail" src="    thumbnails/thumbnail-2.webp">
  </div>

    <div class="channel-picture">
      <img class="profile-picture" src="channel-pictures/channel-2.jpeg">
    </div>

    <div class="video-info">
    
    <p class="video-title">
    Try Not to Laugh Challenge #9
  </p>
  <p class="video-author">
    Markiplier
  </p>
  <p class="video-stats">
    19M views &#183; 4 years ago
  </p>

</div>


</body>
</html>
