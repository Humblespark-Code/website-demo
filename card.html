 <!DOCTYPE html>

</html lang="en">

<head>

  <title><youtube.com</title>

  <style>

   body{
    background-color: #eeeeee;
    font-family: Arial;
    display: flex;
    /* flex-direction: column; */

   }
    
   .card{
    background-color: whitesmoke;
    width: 300px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px;
    transition: 0.3s ease;
    
   }
    
  .card:hover{
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  }
   .card button{
    margin-top: 20px;
    padding: 8px 15px;
    background-color: white;
    border: 1px solid gray;
    border-radius: 5px;
    cursor: pointer;

   }
    .thumbnailA{
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      margin-bottom: 25px;
      cursor: pointer;
      
    }
    .button{
      background-color: #f8d9f2;
      color: purple;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

  

    .arrow{
      background-color: whitesmoke;
      color: black;
      border: 1px solid black;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      padding: 0;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    .card p{
      font-size: 20px;
      font-weight: bold;
    }
    
    .developer{
      cursor: pointer;
    }

    .thumbnailA{
      transition: 0.3s ease;
      cursor: pointer;
    }

    .thumbnailA:hover{
      transform: scale(1.03);
    }

   
  </style>
</head>

<body>

<div class="card">

  <img class="thumbnailA" src="thumbnails/thumbnail-1.webp" alt="Developer">


 <button class="developer">DEVELOPER</button>

  <p>
    A "developer" codes software and websites
  </p>

<button class="arrow">&#8599;</button>

</div>

</body>

</html>
